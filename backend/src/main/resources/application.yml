spring:
  application:
    name: inscripciones-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inscripciones}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  evento:
    cupo-maximo: ${EVENTO_CUPO_MAXIMO:10}
    sede-consejo: ${EVENTO_SEDE_CONSEJO:Lima}
  colegiados-api:
    base-url: ${COLEGIADOS_API_URL:http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-usar-secreto-largo-y-aleatorio-minimo-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:14400000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:inscripciones-imagenes}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
